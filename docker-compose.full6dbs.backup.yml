services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: DoubleCloud-sqlserver
    hostname: sqlserver2025
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "SqlServer2025!Campus"
    ports:
      - "1434:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - DoubleCloud-net

  mysql:
    image: mysql:8.4
    container_name: DoubleCloud-mysql
    hostname: mysql84
    environment:
      MYSQL_ROOT_PASSWORD: "MySQL2025!Campus"
      MYSQL_DATABASE: "doublecloud"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - DoubleCloud-net

  postgres:
    image: postgres:18
    container_name: DoubleCloud-postgres
    hostname: postgres18
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "Postgres2025!Campus"
      POSTGRES_DB: "doublecloud"
    ports:
      - "5433:5432"
    volumes:
      # Corregido: La ruta recomendada oficial para postgresql es agregando /data al final
      - postgres_data:/var/lib/postgresql
    networks:
      - DoubleCloud-net

  mongodb:
    image: mongo:8
    container_name: DoubleCloud-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: Mongo123
    volumes:
      - mongodb_data:/data/db
    networks:
      - DoubleCloud-net

  neo4j:
    image: neo4j:latest
    container_name: DoubleCloud-neo4j
    restart: unless-stopped
    environment:
      # El usuario por defecto siempre es neo4j, aquí definimos tu contraseña estándar
      NEO4J_AUTH: neo4j/Neo4j2025!Campus
    ports:
      - "7474:7474" 
      - "7687:7687" 
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - DoubleCloud-net

  cassandra:
    image: cassandra:latest
    container_name: DoubleCloud-cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: "DoubleCloudCluster"
      CASSANDRA_DC: "datacenter1"
      CASSANDRA_RACK: "rack1"
      CASSANDRA_ENDPOINT_SNITCH: "GossipingPropertyFileSnitch"
    volumes:
      - cassandra_data:/var/lib/cassandra
      - ./cassandra-auth.yaml:/etc/cassandra/cassandra.yaml
    networks:
      - DoubleCloud-net

networks:
  DoubleCloud-net:
    driver: bridge

volumes:
  sqlserver_data:
  mysql_data:
  postgres_data:
  mongodb_data:
  neo4j_data:
  neo4j_logs:
  cassandra_data:
